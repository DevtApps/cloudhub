# Cloud Hub Configuration
# Location: /etc/cloudhub/hub.conf

# Redis Configuration
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=secret
REDIS_DB=0

# Queue Configuration
METRIC_QUEUE=metric-queue
SMTP_SENT_QUEUE=smtp_email_sent

# Job Configuration
JOB_ATTEMPTS=3
JOB_BACKOFF_MS=15000

# API Configuration
API_PORT=3001
CORS_ORIGIN=*

# Logging Configuration
LOG_LEVEL=info
LOGS_DIR=/var/log/cloud-hub

# Environment
NODE_ENV=production

# Database
POSTGRES_HOST=127.0.0.1
POSTGRES_PORT=5432
POSTGRES_USER=postgres
POSTGRES_PASSWORD=secret
POSTGRES_DB=metric-hub

# Services Path Override
SERVICES_NODE_PATH=/opt/cloud-hub/node/bin/node
SERVICES_PYTHON_PATH=/opt/cloud-hub/python/bin/python3
